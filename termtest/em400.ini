type = terminal
transport = tcp
port = 32001
speed = 9600

[dev15.2]
type = terminal
transport = tcp
port = 32002
speed = 9600

[dev15.3]
type = terminal
transport = tcp
port = 32003
speed = 9600

[dev15.4]
