[log]
enabled = false
file = em400.log
#components = "reg,mem,cpu,op,io,mx,px,cchar,cmem,term,wnch,flop,pnch,pnrd,tape,crk5,em4h,fpga"
components = "mem,io,term,em4h,mx,uzdat"
line_buffered = true

[cpu]
fpga = false
speed_real = true
throttle_granularity = 10
clock_period = 10
stop_on_nomem = false
user_io_illegal = false
awp = true
modifications = false

[memory]
elwro_modules = 1
mega_modules = 0
hardwired_segments = 2
#preload = 
mega_prom = /home/amo/.em400/mega0.bin

[ui]
interface = curses

[sound]
enabled = true
driver = pulseaudio
output = default
rate = 96000
buffer_len = 128
latency = 20
volume = 30
filter = true

[fpga]
device = /dev/ttyUSB1
speed = 1000000

[io]
channel_15 = char

[dev15.3]
type = terminal
transport = tcp
port = 32003
speed = 9600
