[log]
enabled = false
file = em400.log
components = "mem,io,uzdat,term,em4h,mx"
line_buffered = true

[cpu]
speed_real = true
clock_period = 10
stop_on_nomem = false
user_io_illegal = false
awp = true
modifications = false

[memory]
elwro_modules = 1
mega_modules = 0
hardwired_segments = 2

[ui]
interface = curses

[sound]
enabled = true
driver = pulseaudio
output = default
rate = 96000
buffer_len = 128
latency = 20
volume = 30
filter = true

[io]
channel_15 = char

[dev15.0]
type = terminal
transport = tcp
port = 32000
speed = 9600
